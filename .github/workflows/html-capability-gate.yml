name: HTML capability gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, live-browser-streaming]

jobs:
  capability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATION_SCREENSHOT_EACH_TEST: 'false'
      AUTOMATION_TEST_COMPLETION_PAUSE_MS: '0'
      AUTOMATION_VIDEO: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install platform and automation runtime
        run: npm install

      - name: Verify server syntax and automation config
        run: |
          npm run test:server-syntax
          npm run test:automation-config

      - name: Verify native HTML, searchable suggestion and enterprise execution contracts
        run: |
          npm run test:html-native-controls
          npm run test:html-capability-contract
          npm run test:searchable-suggestions
          npm run test:enterprise-execution-contract

      - name: Verify Repair Workbench and human automation script
        run: npm run test:repair-workbench-contract

      - name: Preflight installed browser automation binary
        run: ./automation-system/node_modules/.bin/cypress verify

      - name: Run deterministic capability regression suite
        run: npm run test:capabilities

      - name: Start capability target
        run: |
          npm run start:demo-app > /tmp/testnexus-demo.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/capabilities.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/testnexus-demo.log
          exit 1

      - name: Verify direct Chrome rendered discovery writes grounded browser evidence
        run: npm run test:direct-chrome-discovery

      - name: Verify primary rendered browser discovery writes a grounded snapshot
        run: npm run test:rendered-discovery

      - name: Run native browser capability lab
        run: npm run test:html-capability-lab

      - name: Run searchable suggestions browser lab
        run: npm run test:searchable-suggestions-lab

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-capability-artifacts
          path: |
            automation-system/artifacts
          if-no-files-found: ignore
