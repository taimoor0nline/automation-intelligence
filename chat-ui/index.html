<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI TestPilot — Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e9ef;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #23262e;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#4d7cff,#7c4dff); }
  header h1 { font-size: 16px; margin: 0; }
  header .tag { font-size: 12px; color: #8a93a0; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .msg { margin-bottom: 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: #2f5bff; color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: #1a1d24; border: 1px solid #262a33; border-bottom-left-radius: 2px; }
  .msg.bot .bubble strong { color: #7ea8ff; }
  form#composer {
    border-top: 1px solid #23262e;
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #input {
    flex: 1;
    background: #1a1d24;
    border: 1px solid #262a33;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e6e9ef;
    font-size: 14px;
  }
  #input:focus { outline: none; border-color: #4d7cff; }
  button#send {
    background: #2f5bff;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 600;
    cursor: pointer;
  }
  .typing { color: #6b7684; font-size: 13px; padding: 0 24px 8px; max-width: 820px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>AI TestPilot</h1>
      <div class="tag">Story → Qwen → Cypress → Execution → Failure Analysis</div>
    </div>
  </header>

  <div id="log"></div>
  <div class="typing" id="typing" hidden>AI TestPilot is working…</div>

  <form id="composer">
    <input id="input" autocomplete="off" placeholder="e.g. Please test http://localhost:4000/feedback — check email, url, and name validation on submit" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const sessionId = "demo-" + Math.random().toString(36).slice(2, 8);

function addMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = escapeAndFormat(text);
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function escapeAndFormat(text) {
  const div = document.createElement("div");
  div.textContent = text;
  let escaped = div.innerHTML;
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
  return escaped;
}

addMessage("bot",
  "Hi — I'm AI TestPilot. Give me a URL and what you'd like validated, e.g.:\n\n" +
  '"Please test http://localhost:4000/feedback, do the validation checks like email, web url, and name validation upon submit."'
);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage("user", text);
  input.value = "";
  typing.hidden = false;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message: text }),
    });
    const data = await res.json();
    addMessage("bot", data.reply || "(no reply)");
  } catch (err) {
    addMessage("bot", `Error reaching AI TestPilot backend: ${err.message}`);
  } finally {
    typing.hidden = true;
  }
});
</script>
</body>
</html>
