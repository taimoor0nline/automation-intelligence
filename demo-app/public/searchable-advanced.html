<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TestNexus Advanced Searchable Capability Lab</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 18px;line-height:1.45}section{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}input,button{padding:7px;margin:4px}.virtual-list{position:relative;height:150px;overflow-y:auto;border:1px solid #bbb;max-width:420px}.virtual-spacer{position:relative;height:1800px}.virtual-option{position:absolute;left:0;right:0;height:30px;line-height:30px;padding:0 8px;box-sizing:border-box;cursor:pointer}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #aaa;border-radius:14px;padding:4px 7px;display:inline-flex;gap:5px;align-items:center}.chip button{padding:1px 5px;margin:0}.listbox{list-style:none;padding:0;margin:4px 0;border:1px solid #bbb;max-width:420px}.listbox li{padding:6px;cursor:pointer}.listbox li[aria-selected="true"]{font-weight:700}.status{font-family:monospace;background:#f5f5f5;padding:8px}
  </style>
</head>
<body>
  <h1>Advanced searchable controls</h1>
  <p id="advanced-status" class="status" role="status">ready</p>

  <section>
    <h2>Virtualized result list</h2>
    <label>Virtual item
      <input id="virtual-combo" type="text" role="combobox" aria-label="Virtual item" aria-controls="virtual-list" aria-expanded="true" autocomplete="off">
    </label>
    <div id="virtual-list" class="virtual-list" role="listbox" aria-label="Virtualized items" tabindex="0">
      <div id="virtual-spacer" class="virtual-spacer"></div>
    </div>
    <output id="virtual-selected">none</output>
  </section>

  <section>
    <h2>Removable selected tags</h2>
    <label>Skills
      <input id="tag-combo" type="text" role="combobox" aria-label="Skills tags" aria-autocomplete="list" aria-controls="tag-list" aria-expanded="true" autocomplete="off">
    </label>
    <ul id="tag-list" class="listbox" role="listbox" aria-multiselectable="true">
      <li id="tag-opt-laravel" role="option" aria-selected="true" data-value="Laravel">Laravel</li>
      <li id="tag-opt-vue" role="option" aria-selected="false" data-value="Vue">Vue</li>
      <li id="tag-opt-next" role="option" aria-selected="false" data-value="Next.js">Next.js</li>
      <li id="tag-opt-dotnet" role="option" aria-selected="false" data-value="ASP.NET">ASP.NET</li>
      <li id="tag-opt-postgres" role="option" aria-selected="false" data-value="PostgreSQL">PostgreSQL</li>
    </ul>
    <div id="tag-chips" class="chips" aria-label="Selected skill tags"></div>
    <button id="tag-clear-all" type="button" aria-label="Clear all selected tags" aria-controls="tag-list">Clear all</button>
    <output id="tag-selected">Laravel</output>
  </section>

  <script>
    const status=document.getElementById('advanced-status');
    const setStatus=(value)=>{status.textContent=String(value);};

    const virtualList=document.getElementById('virtual-list');
    const virtualSpacer=document.getElementById('virtual-spacer');
    const virtualCombo=document.getElementById('virtual-combo');
    const virtualSelected=document.getElementById('virtual-selected');
    const virtualItems=Array.from({length:60},(_,index)=>`Item ${index+1}`);
    const itemHeight=30;
    function renderVirtual(){
      const start=Math.max(0,Math.min(virtualItems.length-1,Math.floor(virtualList.scrollTop/itemHeight)));
      const end=Math.min(virtualItems.length,start+7);
      virtualSpacer.innerHTML='';
      for(let index=start;index<end;index+=1){
        const option=document.createElement('div');
        const value=virtualItems[index];
        option.className='virtual-option';
        option.style.top=`${index*itemHeight}px`;
        option.id=`virtual-option-${index+1}`;
        option.setAttribute('role','option');
        option.setAttribute('data-value',value);
        option.setAttribute('aria-selected',virtualSelected.value===value?'true':'false');
        option.textContent=value;
        virtualSpacer.appendChild(option);
      }
      setStatus(`virtual-window:${start+1}-${end}`);
    }
    virtualList.addEventListener('scroll',renderVirtual);
    virtualList.addEventListener('click',(event)=>{
      const option=event.target.closest('[role="option"]');
      if(!option)return;
      const value=option.getAttribute('data-value');
      virtualSelected.value=value;virtualSelected.textContent=value;virtualCombo.value=value;
      renderVirtual();setStatus(`virtual-selected:${value}`);
    });
    virtualCombo.addEventListener('click',()=>{virtualCombo.setAttribute('aria-expanded','true');});
    renderVirtual();

    const tagCombo=document.getElementById('tag-combo');
    const tagList=document.getElementById('tag-list');
    const tagChips=document.getElementById('tag-chips');
    const tagSelected=document.getElementById('tag-selected');
    const clearAll=document.getElementById('tag-clear-all');
    const selectedTags=new Set(['Laravel']);
    function tagValue(option){return String(option.getAttribute('data-value')||option.textContent||'').trim();}
    function renderTagOptions(query=''){
      const q=String(query).trim().toLowerCase();
      let visible=0;
      for(const option of tagList.querySelectorAll('[role="option"]')){
        const value=tagValue(option);
        option.setAttribute('aria-selected',selectedTags.has(value)?'true':'false');
        option.hidden=Boolean(q&&!value.toLowerCase().includes(q));
        if(!option.hidden)visible+=1;
      }
      tagList.hidden=visible===0;
      tagCombo.setAttribute('aria-expanded',visible?'true':'false');
    }
    function renderTags(){
      tagChips.innerHTML='';
      for(const value of selectedTags){
        const chip=document.createElement('span');
        chip.className='chip';chip.setAttribute('data-selected-value',value);chip.textContent=value;
        const remove=document.createElement('button');
        remove.type='button';remove.textContent='×';remove.setAttribute('aria-label',`Remove ${value}`);remove.setAttribute('aria-controls','tag-list');remove.dataset.removeValue=value;
        chip.appendChild(remove);tagChips.appendChild(chip);
      }
      const values=[...selectedTags];
      tagSelected.value=values.join(',');tagSelected.textContent=tagSelected.value||'none';
      clearAll.hidden=values.length===0;
      renderTagOptions(tagCombo.value);
    }
    tagCombo.addEventListener('input',()=>renderTagOptions(tagCombo.value));
    tagCombo.addEventListener('click',()=>renderTagOptions(tagCombo.value));
    tagList.addEventListener('click',(event)=>{
      const option=event.target.closest('[role="option"]');if(!option)return;
      const value=tagValue(option);if(selectedTags.has(value))selectedTags.delete(value);else selectedTags.add(value);
      tagCombo.value='';renderTags();setStatus(`tag-toggle:${value}`);
    });
    tagChips.addEventListener('click',(event)=>{
      const button=event.target.closest('button[data-remove-value]');if(!button)return;
      const value=button.dataset.removeValue;selectedTags.delete(value);renderTags();setStatus(`tag-remove:${value}`);
    });
    clearAll.addEventListener('click',()=>{selectedTags.clear();tagCombo.value='';renderTags();setStatus('tag-clear-all');});
    renderTags();
  </script>
</body>
</html>
