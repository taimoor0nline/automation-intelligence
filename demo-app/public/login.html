<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI TestPilot Demo Login</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--border:#e3e8f0;--text:#111827;--muted:#6b7280;--blue:#2f5bff;--red:#b91c1c;--redbg:#fee2e2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);padding:20px}
    .card{width:min(390px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;box-shadow:0 12px 35px rgba(17,24,39,.06)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{font-size:16px}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    h1{font-size:22px;margin:0 0 6px}.sub{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.45}label{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:#4b5563}input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px}input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #eaf0ff}
    button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.error{display:none;margin-top:6px;color:var(--red);font-size:11px}.error.show{display:block}.top-error{display:none;background:var(--redbg);color:var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:14px}.top-error.show{display:block}.demo{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">AI</div><div><strong>AI TestPilot</strong><span>Demo application under test</span></div></div>
    <h1>Sign in</h1>
    <p class="sub">Enter the demo credentials to continue to the customer feedback form.</p>
    <div class="top-error" id="topError" data-testid="login-error" role="alert"></div>
    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required data-testid="username" placeholder="Enter username">
      <div id="usernameError" class="error" data-testid="username-error">Username is required.</div>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required data-testid="password" placeholder="Enter password">
      <div id="passwordError" class="error" data-testid="password-error">Password is required.</div>

      <button id="loginBtn" type="submit" data-testid="login-button">Sign in</button>
    </form>
    <div class="demo">Demo credentials: <strong>admin / admin123</strong></div>
  </main>
<script>
  const form = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const button = document.getElementById('loginBtn');
  const topError = document.getElementById('topError');
  const usernameError = document.getElementById('usernameError');
  const passwordError = document.getElementById('passwordError');

  function clearErrors(){
    topError.classList.remove('show');
    usernameError.classList.remove('show');
    passwordError.classList.remove('show');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearErrors();
    let valid = true;
    if (!username.value.trim()){ usernameError.classList.add('show'); valid = false; }
    if (!password.value){ passwordError.classList.add('show'); valid = false; }
    if (!valid) return;

    button.disabled = true;
    button.textContent = 'Signing in…';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username: username.value.trim(), password: password.value})
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.message || 'Login failed.');
      window.location.href = data.redirect || '/feedback';
    } catch (err) {
      topError.textContent = err.message || 'Invalid username or password.';
      topError.classList.add('show');
      button.disabled = false;
      button.textContent = 'Sign in';
    }
  });

  username.addEventListener('input', clearErrors);
  password.addEventListener('input', clearErrors);
</script>
</body>
</html>
