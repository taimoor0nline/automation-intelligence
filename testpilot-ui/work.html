<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI TestPilot · Project Work</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--border:#e5e9f1;--text:#10141c;--muted:#6b7385;--blue:#2f5bff;--green:#15803d;--red:#b91c1c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);font-size:14px}header{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900}.nav{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:750;font-size:11px;color:#334155;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.wrap{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}.field{margin-top:10px}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff}.field textarea{min-height:76px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.metric{border:1px solid var(--border);border-radius:10px;padding:11px;background:#fff}.metric b{display:block;font-size:22px}.metric span{font-size:10px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eef1f6;text-align:left;font-size:11px;vertical-align:top}th{color:#64748b}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:9px;font-weight:900}.muted{color:var(--muted);font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.section{margin-top:18px}.section h3{margin:0 0 8px;font-size:13px}.error{color:var(--red);font-size:11px;margin-top:8px;white-space:pre-wrap}@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><div class="brand">AI TestPilot · Project Work</div><div class="nav"><a class="btn" href="/">Testing</a><a class="btn" href="/reports.html">Reports</a></div></header>
<div class="wrap"><div class="grid">
<aside class="panel">
  <h3>Project context</h3><div class="muted">Database-enabled project team and workflow management.</div>
  <div class="field"><label>Project</label><select id="project"><option value="">Select project</option></select></div>
  <div class="actions" style="margin-top:10px"><button id="refresh" class="btn">Refresh</button><button id="myWork" class="btn">My Work</button></div><div id="contextError" class="error"></div>
  <div class="section"><h3>Add / update project member</h3><div class="field"><label>User</label><select id="memberUser"><option value="">Select user</option></select></div><div class="field"><label>Project role</label><select id="memberRole"><option>PROJECT_MANAGER</option><option>QA</option><option>DEVELOPER</option><option>VIEWER</option></select></div><button id="saveMember" class="btn primary" style="margin-top:9px">Save member</button><div id="memberError" class="error"></div></div>
  <div class="section"><h3>Create work item</h3><div class="field"><label>Title</label><input id="workTitle" placeholder="Fix TC005 website validation"></div><div class="row"><div class="field"><label>Type</label><select id="workType"><option>DEFECT_FIX</option><option>RETEST</option><option>TEST_REVIEW</option><option>INVESTIGATION</option><option>MANUAL_TEST</option><option>GENERAL</option></select></div><div class="field"><label>Priority</label><select id="workPriority"><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option><option>LOW</option></select></div></div><div class="field"><label>Test case ID (optional)</label><input id="externalCaseId" placeholder="TC005"></div><div class="field"><label>Assign to</label><select id="workAssignee"><option value="">Unassigned</option></select></div><div class="field"><label>Description</label><textarea id="workDescription"></textarea></div><div class="field"><label>Due date (optional)</label><input id="workDue" type="datetime-local"></div><button id="createWork" class="btn primary" style="margin-top:9px">Create work item</button><div id="workError" class="error"></div></div>
</aside>
<main>
  <div class="metrics"><div class="metric"><b id="mPending">0</b><span>Pending</span></div><div class="metric"><b id="mProgress">0</b><span>In Progress</span></div><div class="metric"><b id="mHold">0</b><span>On Hold</span></div><div class="metric"><b id="mRetest">0</b><span>Ready for Retest</span></div><div class="metric"><b id="mDone">0</b><span>Completed</span></div><div class="metric"><b id="mOverdue">0</b><span>Overdue</span></div></div>
  <section class="panel"><h3>Project team</h3><div id="team"><div class="muted">Select a project.</div></div></section>
  <section class="panel section"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>Work board</h3><div class="actions"><select id="statusFilter" class="btn"><option value="">All statuses</option><option>PENDING</option><option>IN_PROGRESS</option><option>ON_HOLD</option><option>READY_FOR_RETEST</option><option>COMPLETED</option><option>CANCELLED</option></select></div></div><div id="work"><div class="muted">Select a project.</div></div></section>
</main></div></div>
<script>
(function(){
const TOKEN='aiTestPilotToken',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let users=[],members=[];function headers(extra={}){const t=sessionStorage.getItem(TOKEN)||'';return t?{...extra,Authorization:'Bearer '+t}:extra}async function api(url,init={}){const r=await fetch(url,{...init,headers:headers(init.headers||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.reply||`Request failed (${r.status})`);return d}function projectId(){return $('project').value}
function renderMembers(){$('team').innerHTML=members.length?'<table><thead><tr><th>Name</th><th>Email</th><th>Project role</th><th></th></tr></thead><tbody>'+members.map(m=>`<tr><td>${esc(m.display_name)}</td><td>${esc(m.email)}</td><td><span class="pill">${esc(m.project_role||m.legacy_role)}</span></td><td><button class="btn" data-remove="${m.user_id}">Remove</button></td></tr>`).join('')+'</tbody></table>':'<div class="muted">No members.</div>';$('team').querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{await api(`/api/projects/${encodeURIComponent(projectId())}/members/${encodeURIComponent(b.dataset.remove)}`,{method:'DELETE'});await loadProject()}catch(e){$('memberError').textContent=e.message}});const options=users.map(u=>`<option value="${u.id}">${esc(u.displayName||u.display_name||u.email)} · ${esc(u.email)}</option>`).join('');$('memberUser').innerHTML='<option value="">Select user</option>'+options;$('workAssignee').innerHTML='<option value="">Unassigned</option>'+members.filter(m=>m.project_role!=='VIEWER').map(m=>`<option value="${m.user_id}">${esc(m.display_name)} · ${esc(m.project_role)}</option>`).join('')}
function renderSummary(s){const b=s.byStatus||{};$('mPending').textContent=b.PENDING||0;$('mProgress').textContent=b.IN_PROGRESS||0;$('mHold').textContent=b.ON_HOLD||0;$('mRetest').textContent=b.READY_FOR_RETEST||0;$('mDone').textContent=b.COMPLETED||0;$('mOverdue').textContent=s.overdue||0}
function statusActions(w){const options=['PENDING','IN_PROGRESS','ON_HOLD','READY_FOR_RETEST','COMPLETED','CANCELLED'];return `<select data-status="${w.id}" class="btn">${options.map(x=>`<option ${x===w.status?'selected':''}>${x}</option>`).join('')}</select>`}
function renderWork(items){$('work').innerHTML=items.length?'<table><thead><tr><th>Case / Work</th><th>Type</th><th>Assigned</th><th>Priority</th><th>Status</th><th>Due</th></tr></thead><tbody>'+items.map(w=>`<tr><td><b>${esc(w.external_case_id||'')}</b> ${esc(w.title)}<div class="muted">${esc(w.description||'')}</div></td><td>${esc(w.work_type)}</td><td>${esc(w.assigned_to_name||'Unassigned')}</td><td>${esc(w.priority)}</td><td>${statusActions(w)}</td><td>${w.due_at?new Date(w.due_at).toLocaleString():'—'}</td></tr>`).join('')+'</tbody></table>':'<div class="muted">No work items.</div>';$('work').querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{try{await api(`/api/work-items/${encodeURIComponent(s.dataset.status)}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});await loadProject()}catch(e){alert(e.message);await loadProject()}})}
async function loadProject(){if(!projectId())return;try{const memberPromise=api(`/api/projects/${projectId()}/members`),summaryPromise=api(`/api/projects/${projectId()}/work-summary`),workPromise=api(`/api/projects/${projectId()}/work-items${$('statusFilter').value?'?status='+encodeURIComponent($('statusFilter').value):''}`),directoryPromise=api(`/api/projects/${projectId()}/user-directory`).catch(()=>({users:[]}));const [m,s,w,d]=await Promise.all([memberPromise,summaryPromise,workPromise,directoryPromise]);members=m.members||[];users=d.users||[];renderMembers();renderSummary(s);renderWork(w.workItems||[]);$('contextError').textContent=''}catch(e){$('contextError').textContent=e.message}}
async function boot(){try{const me=await api('/api/auth/me');if(!me.user)throw new Error('Sign in from the Testing page first.');const p=await api('/api/projects');$('project').innerHTML='<option value="">Select project</option>'+(p.projects||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const q=new URLSearchParams(location.search).get('projectId');if(q&&[...$('project').options].some(o=>o.value===q)){$('project').value=q;await loadProject()}}catch(e){$('contextError').textContent=e.message}}
$('project').onchange=loadProject;$('refresh').onclick=loadProject;$('statusFilter').onchange=loadProject;$('saveMember').onclick=async()=>{try{await api(`/api/projects/${projectId()}/members`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:$('memberUser').value,projectRole:$('memberRole').value})});$('memberError').textContent='';await loadProject()}catch(e){$('memberError').textContent=e.message}};$('createWork').onclick=async()=>{try{await api(`/api/projects/${projectId()}/work-items`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('workTitle').value,workType:$('workType').value,priority:$('workPriority').value,externalCaseId:$('externalCaseId').value,assignedTo:$('workAssignee').value||null,description:$('workDescription').value,dueAt:$('workDue').value?new Date($('workDue').value).toISOString():null})});$('workError').textContent='';$('workTitle').value='';$('workDescription').value='';await loadProject()}catch(e){$('workError').textContent=e.message}};$('myWork').onclick=async()=>{try{const d=await api('/api/my-work-items');renderWork(d.workItems||[])}catch(e){$('contextError').textContent=e.message}};boot();
})();
</script></body></html>
