<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create project | TestNexus</title><link rel="stylesheet" href="/management.css"><link rel="stylesheet" href="/forms-alignment.css"></head>
<body data-management-page="project-create">
<header class="mg-top"><a class="mg-brand" href="/workspace.html#projects"><span class="mg-logo">TN</span><span class="mg-brand-text">TestNexus<small>Project intelligence workspace</small></span></a><nav class="mg-nav" aria-label="Management navigation"><a id="navHome" href="/workspace.html#overview">Home</a><a id="navProjects" href="/workspace.html#projects">Projects</a><a id="navUsers" href="/workspace.html#users" hidden>Users</a><button type="button" id="mgSignOut">Sign out</button></nav></header>
<main class="mg-main"><div class="mg-heading"><div><nav id="mgBreadcrumb" class="mg-breadcrumb" aria-label="Breadcrumb"></nav><h1>Create project</h1><p class="mg-subtitle">Create a project with its core details and optional attachments.</p></div></div>
<div id="mgFeedback" class="mg-feedback" role="alert" hidden></div><section class="mg-card"><div class="mg-card-head"><h2>Project information</h2></div><div class="mg-card-body"><form id="mgProjectForm">
<div class="mg-grid"><div class="mg-field"><label for="mgProjectName">Project name *</label><input id="mgProjectName" name="name" required maxlength="120"></div><div class="mg-field"><label for="mgProjectRef">Reference number</label><input id="mgProjectRef" name="referenceNo" maxlength="80" placeholder="TN-2026-001"></div>
<div class="mg-field mg-full"><label for="mgProjectDescription">Description</label><textarea id="mgProjectDescription" name="description" maxlength="3000"></textarea></div>
<div class="mg-field"><label for="mgProjectStart">Start date</label><input id="mgProjectStart" name="startDate" type="date"></div><div class="mg-field"><label for="mgProjectEnd">End date</label><input id="mgProjectEnd" name="endDate" type="date"></div>
<div class="mg-field mg-full"><label for="mgProjectFiles">Project attachments</label><div id="mgProjectDrop" class="mg-drop" tabindex="0" role="button" aria-label="Choose project attachments">Drag documents here, or click to browse · up to 5 MB each</div><input id="mgProjectFiles" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.pptx,.png,.jpg,.jpeg,.webp,.txt,.csv,.zip" hidden><small id="mgProjectFileNames">No files selected</small></div></div>
<div class="mg-actions"><a href="/workspace.html#projects" class="mg-btn">Cancel</a><button type="submit" class="mg-btn mg-btn-primary" id="mgSubmit">Create project</button></div>
</form></div></section></main>
<script src="/profile-menu.js"></script>
<script src="/management-pages.js"></script></body></html>
