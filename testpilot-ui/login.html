<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | TestNexus AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{min-height:100vh;background:#f5f7fc;color:#152744;display:grid;place-items:center;font-family:system-ui,sans-serif}.auth-card{width:min(100% - 32px,440px);background:#fff;border:1px solid #e1e7f2;border-radius:18px;padding:36px;box-shadow:0 12px 45px #1527440c}.logo{width:50px;height:50px;background:#2563eb;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800}.btn-primary{background:#2563eb}.sub{color:#61738d}</style>
</head><body>
<main class="auth-card">
<div class="d-flex align-items-center gap-3 mb-4"><div class="logo">AI</div><div><h1 class="h4 mb-0">TestNexus AI</h1><div class="sub small">Intelligent Quality Engineering</div></div></div>
<h2 class="h5 mb-2">Sign in to your workspace</h2><p class="sub small mb-4">Access your projects, test plans and reports.</p>
<form id="loginForm">
<div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" type="email" class="form-control" autocomplete="username" required autofocus></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" type="password" class="form-control" autocomplete="current-password" required></div>
<div id="error" role="alert" class="alert alert-danger d-none"></div>
<button id="submit" type="submit" class="btn btn-primary w-100">Sign in</button>
</form>
</main>
<script>
(function(){
 const tokenKey='aiTestPilotToken';
 const next='/workspace.html#projects';
 const form=document.getElementById('loginForm'),error=document.getElementById('error'),submit=document.getElementById('submit');
 async function authenticated(){
  const token=sessionStorage.getItem(tokenKey);
  if(!token)return false;
  try{const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error();return true;}catch{sessionStorage.removeItem(tokenKey);return false;}
 }
 authenticated().then(ok=>{if(ok)location.replace(next);});
 form.addEventListener('submit',async e=>{
  e.preventDefault();error.classList.add('d-none');submit.disabled=true;
  try{
   const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
   const d=await r.json().catch(()=>({}));
   if(!r.ok||!d.token)throw Error(d.reply||'Unable to sign in.');
   sessionStorage.setItem(tokenKey,d.token);
   location.replace(next);
  }catch(err){error.textContent=err.message;error.classList.remove('d-none');submit.disabled=false;}
 });
})();
</script></body></html>
